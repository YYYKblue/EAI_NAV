# 本文件分别加载到 global_costmap 和 local_costmap 命名空间。
# 两套代价地图当前使用相同的机器人模型、分辨率和图层组合。
robot_base_frame: /base_footprint    # 代价地图跟踪的机器人基座坐标系。
resolution: 0.05                    # 栅格分辨率，单位 m/cell。
transform_tolerance: 1.0            # 查询 TF 时允许的最大时间误差，单位 s。
footprint:                          # 机器人二维外轮廓，点按机器人坐标系描述，单位 m。
  [[-0.283, -0.283], [-0.283, 0.283], [0.283, 0.283], [0.283, -0.283]]

plugins:                            # 图层按顺序叠加：静态地图、实时障碍物、膨胀代价。
  - name: static_layer              # 静态地图图层实例名，下面同名配置块归它使用。
    type: costmap_2d::StaticLayer   # 静态占据栅格插件类型。
  - name: obstacle_layer            # 实时障碍物图层实例名。
    type: costmap_2d::VoxelLayer    # 三维体素障碍物插件类型。
  - name: inflation_layer           # 障碍物膨胀图层实例名。
    type: costmap_2d::InflationLayer # 二维代价膨胀插件类型。

static_layer:
  enabled: true                     # 启用静态地图图层。
  map_topic: /map                   # 静态占据栅格地图话题。

obstacle_layer:
  enabled: true                     # 启用三维体素障碍物图层。
  max_obstacle_height: 1.2          # 图层接受的障碍物最大高度，单位 m。
  obstacle_range: 2.0               # 传感器用于标记障碍物的最大距离，单位 m。
  raytrace_range: 5.0               # 传感器射线清除自由空间的最大距离，单位 m。
  combination_method: 1             # 1：取最大代价值，与下层地图叠加。
  observation_sources: >-           # 参与障碍物标记和清除的传感器源名称。
    laser_scan_sensor laser_scan_sensor_2 laser_scan_sensor_3
  track_unknown_space: true          # 保留未知空间，不将其自动视为自由空间。
  footprint_clearing_enabled: true   # 每次更新时清除机器人轮廓内部的障碍物。

  # VoxelLayer 的垂直体素网格。
  origin_z: 0.0                     # 体素网格最低高度，单位 m。
  z_resolution: 0.1                 # 单个垂直体素高度，单位 m。
  z_voxels: 10                      # 垂直方向体素数量，总高度为 1.0 m。
  unknown_threshold: 15             # 一列中未知体素达到该数量时，将二维栅格视为未知。
  mark_threshold: 0                 # 一列中已占用体素超过该数量时，将二维栅格标为障碍。
  publish_voxel_map: true            # 发布体素网格，便于 RViz 调试；会增加通信开销。

  laser_scan_sensor_2:
    data_type: LaserScan             # 观测消息类型。
    topic: /scan_2                   # 低位激光扫描话题。
    marking: true                    # 使用该扫描标记障碍物。
    clearing: true                   # 使用该扫描射线清除自由空间。
    expected_update_rate: 0.0        # 0 表示不因更新超时将该传感器判为失效。
    min_obstacle_height: 0.01        # 接受观测点的最低高度，单位 m。
    max_obstacle_height: 0.1         # 接受观测点的最高高度，单位 m。

  laser_scan_sensor:
    data_type: LaserScan             # 观测消息类型。
    topic: /scan                     # 中位激光扫描话题。
    marking: true                    # 使用该扫描标记障碍物。
    clearing: true                   # 使用该扫描射线清除自由空间。
    expected_update_rate: 0.0        # 0 表示不启用传感器更新超时检查。
    min_obstacle_height: 0.21        # 接受观测点的最低高度，单位 m。
    max_obstacle_height: 0.30        # 接受观测点的最高高度，单位 m。

  laser_scan_sensor_3:
    data_type: LaserScan             # 观测消息类型。
    topic: /scan_3                   # 高位激光扫描话题。
    marking: true                    # 使用该扫描标记障碍物。
    clearing: true                   # 使用该扫描射线清除自由空间。
    expected_update_rate: 0.0        # 0 表示不启用传感器更新超时检查。
    min_obstacle_height: 0.31        # 接受观测点的最低高度，单位 m。
    max_obstacle_height: 0.40        # 接受观测点的最高高度，单位 m。

inflation_layer:
  enabled: true                     # 启用障碍物膨胀图层。
  inflation_radius: 0.50            # 软代价影响到障碍物外 0.50 m，引导全局路径远离墙壁。
  cost_scaling_factor: 3.0          # 降低衰减速度，使全局路径更倾向通道中央。
